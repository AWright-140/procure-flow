version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data       # SQLite DB lives here
      - ./backend:/app/backend
    environment:
      DATABASE_URL: sqlite:////app/data/procurement.db
      LOG_FILE: /app/data/scraper.log
      ENABLE_SCHEDULER: "true"
      SCRAPE_CRON: "0 6 * * *"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
